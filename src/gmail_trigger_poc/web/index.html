<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QuoteFlow — Supplier Outreach Desk</title>
<style>
  :root{
    --navy:#12233D; --navy-2:#1B3252; --ink:#1A2333; --ink-soft:#6B7385; --ink-faint:#9AA1B0;
    --bg:#F4F5F7; --paper:#FFFFFF; --line:#E7E9EF;
    --brass:#B8823C; --brass-dark:#96682C;
    --green:#1E8A5F; --green-bg:#E4F5EC; --red:#C24A3A; --red-bg:#FBEAE6;
    --blue:#3B5FCC; --blue-bg:#E9EDFB; --amber:#B07A1E; --amber-bg:#FBF0DA;
    --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 8px 24px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px}
  button{font-family:var(--sans);cursor:pointer}
  a{color:var(--brass-dark)}
  code{background:#eef;border-radius:4px;padding:1px 5px;font-size:12px}

  header{display:flex;align-items:center;gap:14px;background:var(--navy);color:#fff;padding:10px 18px}
  .mark{width:28px;height:28px;border-radius:8px;background:var(--brass);color:#241705;font-weight:800;
        display:flex;align-items:center;justify-content:center}
  header .title{font-weight:700;letter-spacing:-.01em}
  header nav{display:flex;gap:4px;margin-left:8px}
  header nav button{background:none;border:1px solid #33455f;color:#c6d1e2;border-radius:18px;
        padding:5px 13px;font-size:12.5px}
  header nav button.active{background:var(--brass);border-color:var(--brass);color:#241705;font-weight:700}
  header .spacer{flex:1}
  .pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .pill.ok{background:var(--green-bg);color:#12694a}
  .pill.warn{background:var(--amber-bg);color:#8a5e12}
  .pill.err{background:var(--red-bg);color:#8f2e22}
  header .hbtn{background:#fff;color:var(--navy);border:none;border-radius:9px;padding:7px 12px;font-weight:700;font-size:12.5px}

  main{max-width:1180px;margin:0 auto;padding:18px}
  .view{display:none}
  .view.active{display:block}

  .grid{display:grid;grid-template-columns:380px 1fr;gap:18px;align-items:start}
  @media(max-width:880px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .panel .phead{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
  .phead h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}
  .toggle{font-size:11.5px;color:var(--ink-soft);display:flex;align-items:center;gap:5px}

  .deal{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .deal:last-child{border-bottom:none}
  .deal:hover{background:#fafbfc}
  .deal.sel{background:#FBF5EC;box-shadow:inset 3px 0 0 var(--brass)}
  .deal .row1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .deal .subj{font-weight:650;line-height:1.35}
  .deal .from{font-size:12px;color:var(--ink-faint);margin-top:2px}
  .deal .meta{font-size:11px;color:var(--ink-faint);margin-top:8px;display:flex;gap:10px}
  .badge{font-size:10px;font-weight:800;padding:3px 8px;border-radius:20px;letter-spacing:.03em}
  .badge.drafted{background:var(--green-bg);color:#12694a}
  .badge.logged{background:var(--line);color:var(--ink-soft)}
  .badge.sent{background:var(--blue-bg);color:#2c46a0}
  .badge.new{background:var(--blue-bg);color:#2c46a0}
  .badge.processing{background:var(--amber-bg);color:#8a5e12}

  .empty{padding:60px 20px;text-align:center;color:var(--ink-faint)}

  .email-card{padding:14px 16px;border-bottom:1px solid var(--line)}
  .email-card .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-faint);font-weight:700}
  .email-card .txt{white-space:pre-wrap;line-height:1.55;margin-top:6px}
  .kv{font-size:12px;color:var(--ink-soft)} .kv b{color:var(--ink)}

  .progress{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:#fafbfc;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-soft)}
  .progress b{color:var(--ink)}

  .scard{padding:14px 16px;border-bottom:1px solid var(--line)}
  .scard:last-child{border-bottom:none}
  .scard.sent{opacity:.75}
  .scard .sc1{display:flex;justify-content:space-between;align-items:center}
  .scard .sname{font-weight:700}
  .scard .smeta{font-size:11.5px;color:var(--ink-faint);margin:2px 0 10px}
  .mail{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
  .mail .mrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
  .mail .mrow span{width:52px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);font-weight:700}
  .mail .mrow input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;background:#fff;font-family:var(--sans)}
  .mail .mbody{border-top:1px solid var(--line);padding-top:8px;white-space:pre-wrap;line-height:1.55;font-size:12.5px}

  .fields .f{margin-bottom:9px}
  .fields .flabel{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .fields .flabel span{font-size:11.5px;color:var(--ink-soft);font-weight:600}
  .tag{font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px}
  .tag.AI-GENERATED{background:var(--amber-bg);color:var(--amber)}
  .tag.FROM-DATABASE{background:var(--blue-bg);color:var(--blue)}
  .tag.NEEDS-REVIEW{background:var(--red-bg);color:var(--red)}
  .tag.MANUAL{background:var(--green-bg);color:var(--green)}
  .fields input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:var(--sans);background:#fff}
  .fields input.rev{border-color:var(--red);background:#FFFAF9}

  .actions{display:flex;gap:8px;margin-top:12px}
  .btn{border:none;border-radius:9px;padding:9px 14px;font-weight:700;font-size:12.5px}
  .btn.primary{background:var(--brass);color:#241705}
  .btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink-soft)}
  .btn:disabled{opacity:.5;cursor:default}
  .sent-note{background:var(--green-bg);color:#12694a;border-radius:8px;padding:8px 10px;font-size:11.5px;font-weight:600}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line)}
  th{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint)}
  .stars{color:var(--brass)}

  dialog{border:none;border-radius:14px;box-shadow:var(--shadow);padding:0;max-width:560px;width:92%}
  dialog::backdrop{background:rgba(15,23,42,.35)}
  .dlg{padding:18px}
  .dlg h3{margin:0 0 4px} .dlg p{margin:0 0 14px;color:var(--ink-soft);font-size:12.5px}
  .dlg label{display:block;font-size:11.5px;font-weight:600;color:var(--ink-soft);margin:10px 0 4px}
  .dlg input,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:var(--sans);font-size:13px}
  .dlg textarea{min-height:120px;resize:vertical}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
         padding:10px 16px;border-radius:10px;font-size:12.5px;box-shadow:var(--shadow);opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="mark">Q</div>
  <div class="title">QuoteFlow</div>
  <nav>
    <button id="tab-desk" class="active" onclick="showView('desk')">Desk</button>
    <button id="tab-suppliers" onclick="showView('suppliers')">Suppliers</button>
  </nav>
  <div class="spacer"></div>
  <span id="health" class="pill warn">checking…</span>
  <button class="hbtn" onclick="openSim()">Simulate email</button>
</header>

<main>
  <!-- DESK -->
  <section id="view-desk" class="view active">
    <div class="grid">
      <div class="panel">
        <div class="phead">
          <h2>The Desk</h2>
          <label class="toggle"><input type="checkbox" id="showAll" onchange="loadDesk()"> show seed backfill</label>
        </div>
        <div id="deals"><div class="empty">loading…</div></div>
      </div>
      <div class="panel" id="detail">
        <div class="empty">Select an enquiry, or <a href="#" onclick="openSim();return false">simulate an incoming email</a>.</div>
      </div>
    </div>
  </section>

  <!-- SUPPLIERS -->
  <section id="view-suppliers" class="view">
    <div class="panel">
      <div class="phead"><h2>Supplier directory</h2><span id="supCount" class="kv"></span></div>
      <div style="overflow-x:auto"><table id="supTable"><tbody></tbody></table></div>
    </div>
  </section>
</main>

<dialog id="sim">
  <form class="dlg" method="dialog" onsubmit="return submitSim()">
    <h3>Simulate an incoming client email</h3>
    <p>POSTs to <code>/process-email</code> — the same call the Gmail poller makes.</p>
    <label>From</label>
    <input id="sim-from" value='"Priya Nair" &lt;priya.nair@nairelectronics.in&gt;'>
    <label>Subject</label>
    <input id="sim-subject" value="Enquiry: Lithium-ion 18650 cells - 25,000 pcs">
    <label>Body</label>
    <textarea id="sim-body">We are sourcing rechargeable lithium-ion 18650 battery cells (3.7V ~3000mAh, UN38.3 tested).
- Product: Lithium-ion Battery Cells 18650
- Quantity required: 25,000 pieces
- Preferred delivery terms: FOB Shenzhen
- Delivery location: Bangalore, India
Somewhat urgent - please share pricing, MOQ and lead time.</textarea>
    <div class="actions">
      <button class="btn primary" type="submit">Deliver to pipeline</button>
      <button class="btn ghost" type="button" onclick="document.getElementById('sim').close()">Cancel</button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let state = { selected:null, drafts:null, deskTimer:null };

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error((body && body.detail) || r.status + " " + r.statusText);
  return body;
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}

function showView(name) {
  for (const v of document.querySelectorAll(".view")) v.classList.toggle("active", v.id === "view-" + name);
  for (const b of document.querySelectorAll("header nav button")) b.classList.toggle("active", b.id === "tab-" + name);
  clearInterval(state.deskTimer);
  if (name === "desk") { loadDesk(); state.deskTimer = setInterval(loadDesk, 5000); }
  if (name === "suppliers") loadSuppliers();
}

async function loadHealth() {
  try {
    const h = await api("/health");
    const el = $("#health");
    el.className = "pill ok";
    el.textContent = `poller ${h.poller_alive ? "live" : (h.poller_enabled ? "starting" : "off")} · llm:${h.llm_provider} · emb:${h.embedding_provider}`;
  } catch (e) { $("#health").className = "pill err"; $("#health").textContent = "backend down"; }
}

async function loadDesk() {
  try {
    const all = $("#showAll").checked;
    const { enquiries } = await api("/enquiries" + (all ? "?include_all=true" : ""));
    const host = $("#deals");
    if (!enquiries.length) { host.innerHTML = `<div class="empty">No enquiries yet.</div>`; return; }
    host.innerHTML = enquiries.map(e => {
      const bucket = e.all_sent ? "sent"
        : (["new", "processing", "drafted"].includes(e.status) ? e.status : "logged");
      const label = { new: "new", processing: "processing", drafted: "drafted", sent: "all sent" }[bucket]
        || esc(e.scenario || "logged");
      const b = `<span class="badge ${bucket}">${label}</span>`;
      const progress = (bucket === "new" || bucket === "processing")
        ? `<span>${esc(e.pipeline_stage || "queued")}</span>`
        : `<span>${e.drafts} draft(s)</span>`;
      return `<div class="deal ${state.selected === e.email_thread_id ? "sel" : ""}" onclick="openEnquiry(${e.email_thread_id})">
        <div class="row1"><div class="subj">${esc(e.subject || "(no subject)")}</div>${b}</div>
        <div class="from">${esc(e.from_email)}</div>
        <div class="meta"><span>#${e.email_thread_id}</span>${progress}
          ${e.drafts ? `<span>${e.sent}/${e.drafts} sent</span>` : ""}</div>
      </div>`;
    }).join("");
  } catch (e) { $("#deals").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function openEnquiry(id) {
  state.selected = id;
  loadDesk();
  try {
    const data = await api(`/enquiry/${id}/supplier-drafts`);
    state.drafts = data;
    renderDetail(data);
  } catch (e) { $("#detail").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

function composeBody(tpl, fields) {
  return (tpl || "").replace(/\{\{\s*(\w+)\s*\}\}/g, (m, k) => {
    const f = fields.find(x => x.key === k);
    return f ? f.value : m;
  });
}

function renderDetail(d) {
  const oe = d.original_email || {};
  const ex = oe.extracted || {};
  const cards = (d.supplier_drafts || []).map(s => {
    const sent = s.status === "sent";
    const fieldsHtml = (s.draft_fields || []).map((f, i) => `
      <div class="f">
        <div class="flabel"><span>${esc(f.label)}</span><span class="tag ${esc(f.tag)}">${esc(f.tag)}</span></div>
        <input data-sqr="${s.id}" data-fi="${i}" value="${esc(f.value)}" ${sent ? "disabled" : ""}
               class="${f.tag === "NEEDS-REVIEW" ? "rev" : ""}" oninput="onFieldEdit(${s.id})">
      </div>`).join("");
    return `<div class="scard ${sent ? "sent" : ""}" id="sc-${s.id}">
      <div class="sc1"><div class="sname">${esc(s.supplier_name)}</div>
        ${sent ? `<span class="badge sent">sent</span>` : `<span class="badge drafted">match ${Math.round((s.match_score || 0) * 100)}%</span>`}</div>
      <div class="smeta">★ ${s.supplier_rating ?? "—"} · supplier #${s.supplier_id}${s.sent_at ? " · " + esc(s.sent_at) : ""}</div>
      ${sent ? `<div class="sent-note">Marked sent — not transmitted (gmail.send out of scope).</div>` : ""}
      <div class="mail">
        <div class="mrow"><span>To</span><input data-sqr="${s.id}" data-k="draft_to" value="${esc(s.draft_to)}" ${sent ? "disabled" : ""}></div>
        <div class="mrow"><span>Subject</span><input data-sqr="${s.id}" data-k="draft_subject" value="${esc(s.draft_subject)}" ${sent ? "disabled" : ""}></div>
        <div class="mbody" id="body-${s.id}">${esc(s.draft_body)}</div>
      </div>
      <div class="fields">${fieldsHtml}</div>
      ${sent ? "" : `<div class="actions">
        <button class="btn primary" onclick="sendDraft(${s.id})">Send to supplier</button>
        <button class="btn ghost" onclick="saveDraft(${s.id})">Save draft</button>
      </div>`}
    </div>`;
  }).join("") || `<div class="empty">No supplier cleared the match threshold for this enquiry.</div>`;

  $("#detail").innerHTML = `
    <div class="phead"><h2>Enquiry #${d.email_thread_id}</h2>
      <button class="btn ghost" onclick="state.selected=null;$('#detail').innerHTML='';loadDesk()">close</button></div>
    <div class="email-card">
      <div class="lbl">Original client email</div>
      <div class="kv" style="margin-top:6px"><b>From</b> ${esc(oe.from)}</div>
      <div class="kv"><b>Subject</b> ${esc(oe.subject)}</div>
      ${ex.scenario ? `<div class="kv"><b>Extracted</b> ${esc(ex.product_description || "")} · qty ${esc(ex.quantity)} ${esc(ex.unit_of_measure || "")} · ${esc(ex.delivery_terms || "")} · urgency ${esc(ex.urgency || "")}</div>` : ""}
      <div class="txt">${esc(oe.body)}</div>
    </div>
    <div class="progress"><span>Supplier outreach</span><b>${d.progress.sent} / ${d.progress.total} sent</b></div>
    ${cards}`;
}

function currentFields(sqrId) {
  const inputs = document.querySelectorAll(`input[data-sqr="${sqrId}"][data-fi]`);
  const src = state.drafts.supplier_drafts.find(s => s.id === sqrId).draft_fields;
  return [...inputs].map(inp => ({ ...src[+inp.dataset.fi], value: inp.value }));
}
function currentMeta(sqrId) {
  const g = k => document.querySelector(`input[data-sqr="${sqrId}"][data-k="${k}"]`)?.value;
  return { to: g("draft_to"), subject: g("draft_subject") };
}
function onFieldEdit(sqrId) {
  const s = state.drafts.supplier_drafts.find(x => x.id === sqrId);
  $("#body-" + sqrId).textContent = composeBody(s.draft_body_template, currentFields(sqrId));
}

async function saveDraft(sqrId) {
  const meta = currentMeta(sqrId);
  const updated = await api(`/supplier-quote-requests/${sqrId}`, {
    method: "PATCH", headers: { "content-type": "application/json" },
    body: JSON.stringify({ draft_to: meta.to, draft_subject: meta.subject, fields: currentFields(sqrId) }),
  });
  toast("Draft saved");
  const s = state.drafts.supplier_drafts.find(x => x.id === sqrId);
  Object.assign(s, updated, { draft_fields: updated.draft_fields });
  $("#body-" + sqrId).textContent = updated.draft_body;
}

async function sendDraft(sqrId) {
  const meta = currentMeta(sqrId);
  const s = state.drafts.supplier_drafts.find(x => x.id === sqrId);
  const body = composeBody(s.draft_body_template, currentFields(sqrId));
  const res = await api(`/supplier-quote-requests/${sqrId}/send`, {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ to: meta.to, subject: meta.subject, body, fields: currentFields(sqrId) }),
  });
  toast(`Sent (mark-only) · ${res.progress.sent}/${res.progress.total}`);
  openEnquiry(state.selected);
}

async function loadSuppliers() {
  const { count, suppliers } = await api("/suppliers");
  $("#supCount").textContent = count + " suppliers";
  $("#supTable tbody").innerHTML =
    `<tr><th>Name</th><th>Specialisation</th><th>Region</th><th>Rating</th><th>Contact</th><th>Payment terms</th></tr>` +
    suppliers.map(s => `<tr>
      <td><b>${esc(s.name)}</b></td><td>${esc(s.specialization)}</td><td>${esc(s.region)}</td>
      <td class="stars">★ ${s.rating}</td><td>${esc(s.contact_email)}</td><td>${esc(s.payment_terms)}</td>
    </tr>`).join("");
}

function openSim() { $("#sim").showModal(); }
async function submitSim() {
  const payload = {
    id: "ui-" + Date.now(),
    from: $("#sim-from").value, to: "procurement@meridiantrade.com",
    subject: $("#sim-subject").value, body: $("#sim-body").value,
  };
  try {
    const res = await api("/process-email", {
      method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(payload),
    });
    $("#sim").close();
    toast(`${res.status}${res.supplier_quote_request_ids ? " · " + res.supplier_quote_request_ids.length + " draft(s)" : ""}`);
    await loadDesk();
    if (res.email_thread_id) openEnquiry(res.email_thread_id);
  } catch (e) { toast("Error: " + e.message); }
  return false;
}

loadHealth(); setInterval(loadHealth, 8000);
showView("desk");
</script>
</body>
</html>
